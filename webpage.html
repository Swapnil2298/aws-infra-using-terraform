<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Static Site 1</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* Reset some default styles */
        body, h1, p {
            margin: 0;
            padding: 0;
        }

        /* Full page layout */
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #f39c12, #f1c40f); /* Gradient Background */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Centered container */
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.6); /* Dark overlay */
            padding: 40px;
            border-radius: 15px;
            max-width: 600px;
            width: 100%;
            opacity: 0;
            animation: fadeIn 1s ease-in-out forwards;
        }

        /* Fade-in animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            font-weight: 600;
            animation: fadeIn 1.5s ease-in-out forwards;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
            animation: fadeIn 2s ease-in-out forwards;
        }

        .cta-button {
            padding: 15px 30px;
            background-color: #ff6347;
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.3s ease-in-out, background-color 0.3s ease;
        }

        .cta-button:hover {
            background-color: #ff4500;
            transform: translateY(-5px); /* Button lift effect */
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to My Static Website !</h1>
        <p>This website is hosted on AWS EC2 Instance using Load Balancer and AutoScaling Group.</p>
        <a href="#" class="cta-button">Explore More</a>
    </div>

</body>
</html>
